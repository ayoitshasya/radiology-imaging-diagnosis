[project]
name = "radiology-imaging-diagnosis"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "needs_dvc: needs files restored by `dvc pull` (data under data/); always run locally, deselected in CI with -m 'not needs_dvc' because CI has no access to the DVC remote",
]
