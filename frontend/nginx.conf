# Static server for the built viewer. The browser calls the API directly at
# VITE_API_BASE_URL; nginx only serves files.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Client-side routes (/studies/:id, /audit) are served index.html so a reload works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
