# Central project configuration. Paths are relative to the repository root.
# Secrets (database passwords, API tokens) belong in .env, never here.

project:
  name: radiology-imaging-diagnosis
  seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  models: models
  reports: reports
  notebooks: notebooks

data:
  image_size: [224, 224]  # (H, W); DenseNet121 ImageNet weights expect 224x224
  val_split: 0.15
  test_split: 0.15
  num_workers: 4

rsna_sample:
  competition: rsna-pneumonia-detection-challenge
  dir: data/raw/rsna_sample
  images_subdir: stage_2_train_images
  labels_csv: stage_2_train_labels.csv
  class_info_csv: stage_2_detailed_class_info.csv
  per_class: 300       # patients with Target=1 and with Target=0
  max_retries: 3
  min_free_gb: 2

preprocess:
  input: data/raw/rsna_sample/stage_2_train_images
  labels: data/raw/rsna_sample/stage_2_train_labels.csv
  output: data/processed/rsna_sample
  report: reports/preprocessing_summary.json
  # Resolution stored on disk. Kept separate from data.image_size (the model input) so
  # images could later be stored larger and cropped without re-running preprocessing.
  size: 224

classification:
  backbone: densenet121       # torchvision implementation
  pretrained: true            # ImageNet weights
  data_dir: data/processed/rsna_sample
  models_dir: models
  reports_dir: reports
  batch_size: 32              # sized for a Kaggle GPU; pass --batch-size locally
  epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  plateau_factor: 0.5         # LR multiplier when val AUROC stops improving
  plateau_patience: 2
  early_stopping_patience: 5
  smoke:                      # --smoke-test: pipeline check only, metrics are meaningless
    epochs: 2
    train_images: 64
    val_images: 32
    batch_size: 4

demo:
  # Sample images that fall in the FULL test split: the only ones safe for demos and
  # Grad-CAM validation, because the full-data model never trained on them.
  sample_manifests:
    - data/processed/rsna_sample/manifest.csv
    - data/processed/demo_negatives/manifest.csv
  full_manifest: data/processed/full/manifest.csv
  output: data/demo/test_studies.csv
  report: reports/demo_test_studies.json

demo_negatives:
  # Negatives from the FULL test split, added because seed 42 sent every sampled negative
  # to the full train split. A different seed avoids reusing the split's random draw.
  seed: 7
  per_view: 20          # 20 AP + 20 PA
  batch_size: 10        # downloads per round; view is only known after download
  dir: data/raw/rsna_demo_negatives
  ids_file: demo_negatives.csv
  processed: data/processed/demo_negatives
  report: reports/demo_negatives_selection.json

orthanc_upload:
  # DICOMs are found by StudyInstanceUID among these files and anonymised in memory
  # before upload; files on disk are never modified.
  raw_glob: data/raw/*/stage_2_train_images/*.dcm
  timeout_seconds: 30

backend:
  model_name: densenet121-rsna-pneumonia
  checkpoint: models/densenet121_best.pt
  checkpoint_dvc: models/densenet121_best.pt.dvc   # pulled at startup if the .pt is missing
  # The decision threshold is read from here (chosen on validation), never hard coded.
  metrics_report: reports/classification_metrics.json
  orthanc_timeout_seconds: 10
  notice: "Educational use only. Not for clinical use."

evaluation:
  bootstrap_resamples: 1000
  ci_level: 0.95
  calibration_bins: 10

explainability:
  method: gradcam
  # Last dense block of torchvision's DenseNet121: the deepest layer that still has
  # spatial resolution, so the heatmap can be mapped back onto the image.
  target_layer: features.denseblock4
  checkpoint: models/densenet121_best.pt
  # The validation-chosen threshold is read from here, so true positives are defined
  # without looking at test data.
  metrics_report: reports/classification_metrics.json
  output_dir: data/demo/gradcam   # overlays contain X-ray pixels; data/ is gitignored
  validation:                     # local defaults; Kaggle passes its own paths
    data_dir: data/demo
    manifest: test_studies.csv
    split: test
    dicom_dir: data/raw/rsna_sample/stage_2_train_images
    labels: data/raw/rsna_sample/stage_2_train_labels.csv
    report: reports/gradcam_localisation_demo.json
    bootstrap_resamples: 1000

device: cpu
