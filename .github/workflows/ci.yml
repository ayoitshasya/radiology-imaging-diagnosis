# Lint, tests and image builds on every push and pull request. Educational project.
# Actions are pinned to full commit SHAs (the version is in the comment) so a moved tag
# cannot change what runs. The token is read-only: nothing is pushed or published.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # Same Postgres 16 image digest as docker-compose.yml.
        image: postgres@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_DB: radiology
          POSTGRES_USER: radiology
          # Throwaway password for a container that exists only during this job.
          POSTGRES_PASSWORD: ci-only-not-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radiology -d radiology"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://radiology:ci-only-not-secret@localhost:5432/radiology
      # The tests replace Orthanc with an in-memory fake; these only satisfy the settings.
      ORTHANC_URL: http://localhost:8042
      ORTHANC_USERNAME: ci
      ORTHANC_PASSWORD: ci-only-not-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (CPU-only PyTorch via the index in requirements.txt)
        run: python -m pip install -r requirements.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Pytest
        # needs_dvc tests read data restored by `dvc pull`; CI has no access to the DVC
        # remote, so they are deselected here and run locally. With CI=true a missing
        # database fails the database tests instead of skipping them.
        run: python -m pytest -m "not needs_dvc" -p no:cacheprovider

  frontend:
    name: Frontend (type check, Vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: radiology-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: false
          build-args: VITE_API_BASE_URL=http://127.0.0.1:8000
          tags: radiology-frontend:ci
